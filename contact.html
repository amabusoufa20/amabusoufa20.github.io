<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- REPLACE 20XXXXXXXX with your Student ID -->
  <title>149875 - Aya Abu Soufa | Contact Me</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation menu -->
  <nav class="navbar">
    <span class="logo">Aya Abu Soufa</span>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html" class="active">Contact Me</a></li>
    </ul>
  </nav>

  <main>
    <section class="card form-card">
      <h1>Contact Me</h1>
      <p class="form-intro">Have a question or an opportunity? Send me a message below.</p>

      <!-- novalidate: validation is done by JavaScript in script.js -->
      <form id="contactForm" novalidate>
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Your full name">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">

        <label for="country">Country</label>
        <select id="country" name="country">
          <option value="">-- Select your country --</option>
          <option>Jordan</option>
          <option>Saudi Arabia</option>
          <option>United Arab Emirates</option>
          <option>Palestine</option>
          <option>Egypt</option>
          <option>Iraq</option>
          <option>Lebanon</option>
          <option>Syria</option>
          <option>Kuwait</option>
          <option>Qatar</option>
          <option>United States</option>
          <option>United Kingdom</option>
          <option>Other</option>
        </select>

        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5" placeholder="Write your message here"></textarea>

        <p id="errorMsg" class="error"></p>

        <button type="submit" class="btn">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Aya Abu Soufa &middot; <a href="index.html">Home</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
